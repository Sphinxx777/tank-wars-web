<!doctype html><html lang="ru"><meta charset="utf-8"><title>Tank Wars — проверка оригинального магазина и PC Speaker</title><style>body{background:#17141a;color:#eee;font:15px system-ui;margin:24px}canvas{display:block;width:960px;height:auto;aspect-ratio:4/3;image-rendering:pixelated;max-width:100%}button{font:inherit;margin:5px;padding:8px}#status{white-space:pre-wrap}</style><h1>Tank Wars 3.2 — проверка реконструкции</h1><canvas id="screen" width="320" height="200"></canvas><div id="controls"></div><p id="status">Загрузка…</p><script type="module">
import {Renderer} from '../dist/render.js';import {Random,Game} from '../dist/engine.js';import {PCSpeaker,launchSound,blastSound,laserCharge,sonicSound,controlSound,PITVoice} from '../dist/sound.js';import {shopItems,shopStock,visibleShopItems,cartCost,reserve} from '../dist/shop.js';
const catalog=await(await fetch('../dist/assets/weapons.json')).json(),fonts={};for(const f of ['tiny','litt','euro'])fonts[f]=await(await fetch('../dist/assets/'+f+'-font.json')).json();const bitmap=new Uint8Array(await(await fetch('../dist/assets/font8.bin')).arrayBuffer());const r=new Renderer(document.querySelector('canvas'),fonts,bitmap),g=new Game(catalog.weapons,{wind:0},42);g.start([{name:'Player 1'},{name:'Player 2'}]);g.players[0].money=200000;g.players[0].ammo=Array(18).fill(100);g.players[0].guidance=[5,5];g.players[0].defense=[1000,100,1];const app={screen:'shop',options:g.options,game:g,shopPlayer:0,shopSelection:0,cart:[],shopItems:shopItems(catalog),shopStock(it){return shopStock(g.players[0],it)},shopVisible(){return visibleShopItems(g.players[0],this.shopItems)},cartCost(){return cartCost(this.cart,this.shopItems)}};
const speaker=new PCSpeaker(),status=document.querySelector('#status'),controls=document.querySelector('#controls');
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;controls.append(b);}
function draw(){r.render(app,0);status.textContent='Карточек: '+app.shopVisible().length+' · Доступно: '+(g.players[0].money-app.cartCost())+' · Корзина: '+app.cartCost();}
button('Магазин',()=>{app.screen='shop';draw()});button('Все иконки',()=>{app.screen='battle';g.active=0;draw()});button('Добавить комплект',()=>{reserve(app.cart,app.shopItems,g.players[0],0);draw()});button('Убрать комплект',()=>{reserve(app.cart,app.shopItems,g.players[0],0,-1);draw()});
for(const [name,fn] of [['Выстрел',()=>launchSound()],['Взрыв',()=>blastSound(10,new Random(42))],['Ядерный взрыв',()=>blastSound(60,new Random(42))],['Лазер',()=>laserCharge()],['Sonic',()=>sonicSound(new Random(42))],['Разворот',()=>controlSound('flip')]])button(name,()=>{speaker.unlock();speaker.stop();speaker.play(fn());status.textContent='PC Speaker: '+name;});
button('Проверить аудиовыход',async()=>{speaker.unlock();await speaker.loading;const analyser=speaker.context.createAnalyser();speaker.node.connect(analyser);speaker.stop();speaker.play(laserCharge());const data=new Float32Array(analyser.fftSize);let peak=0;const timer=setInterval(()=>{analyser.getFloatTimeDomainData(data);peak=Math.max(peak,...data.map(Math.abs));status.textContent='AudioWorklet: '+speaker.context.state+' · измеренная амплитуда: '+peak.toFixed(4);},50);setTimeout(()=>{clearInterval(timer);speaker.node.disconnect(analyser);status.textContent+=' · '+(peak>0?'PASS':'FAIL');},1800);});
draw();
</script></html>
