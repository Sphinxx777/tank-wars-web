<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Terrain and shopping verification</title>
  <style>
    body {
      background: #15121a;
      color: #eee;
      font: 16px system-ui;
      margin: 24px;
    }
    canvas {
      width: 640px;
      max-width: 100%;
      aspect-ratio: 4/3;
      image-rendering: pixelated;
    }
    button,
    a {
      padding: 10px;
      margin: 8px;
    }
    #views {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    figure {
      margin: 0;
    }
    figcaption {
      padding: 8px;
    }
  </style>
  <h1>Terrain settling — before, during, after</h1>
  <div id="views"></div>
  <button id="run">Play collapse</button>
  <button id="shop">Check computer shopping</button>
  <p id="status">Loading…</p>
  <script type="module">
    import { Game, BOTTOM } from '../dist/engine.js';
    import { Renderer } from '../dist/render.js';
    import { loadGameAssets } from '../dist/assets-loader.js';
    const { catalog, fonts, bitmap, title } = await loadGameAssets();
    const views = [];
    function scene() {
      const g = new Game(
        catalog.weapons,
        { sound: false, wind: 0, crumble: 100, background: 0, walls: 0 },
        21,
      );
      g.start([{ name: 'Player 1' }, { name: 'Rifleman', ai: 2 }]);
      while (g.falling) g.update(1 / 60);
      g.terrain.data.fill(0);
      for (let x = 11; x <= 309; x++) for (let y = 90; y <= BOTTOM; y++) g.terrain.set(x, y, 1);
      g.players.forEach((p, i) => {
        p.x = 50 + 220 * i;
        p.y = 89;
      });
      g.terrain.circle(160, 135, 35, 0);
      g.phase = 'flight';
      g.resolveTerrain();
      g.terrainResolved = true;
      return g;
    }
    for (const [label, seconds] of [
      ['Before collapse', 0],
      ['Falling dirt', 0.15],
      ['Settled ground', 2],
    ]) {
      const fig = document.createElement('figure'),
        c = document.createElement('canvas'),
        caption = document.createElement('figcaption');
      c.width = 320;
      c.height = 200;
      caption.textContent = label;
      fig.append(c, caption);
      document.querySelector('#views').append(fig);
      const g = scene();
      for (let t = 0; t < seconds; t += 1 / 120) g.update(1 / 120);
      const renderer = new Renderer(c, fonts, bitmap, title);
      const app = { screen: 'battle', options: g.options, game: g };
      renderer.render(app, 0);
      views.push({ g, renderer, app });
    }
    document.querySelector('#status').textContent =
      'Verified intermediate terrain frames. AI shopping test opens the actual game on this isolated test origin.';
    document.querySelector('#run').onclick = () => {
      const view = views[1];
      view.g = scene();
      view.app.game = view.g;
      let previous;
      function frame(time) {
        if (previous) view.g.update(Math.min(0.05, (time - previous) / 1000));
        previous = time;
        view.renderer.render(view.app, time / 1000);
        if (view.g.phase === 'flight') requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    };
    document.querySelector('#shop').onclick = () => {
      const g = scene();
      g.crumbling = null;
      g.phase = 'score';
      g.players[0].money = 0;
      g.players[1].money = 30000;
      g.players[1].score = 30000;
      g.players[1].shoppingStrategy = 3;
      g.players[1].ammo[1] = 30;
      localStorage.setItem('tank-wars-save-v1', g.serialize());
      location.href = '../dist/';
    };
  </script>
</html>
