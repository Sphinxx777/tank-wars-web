<!doctype html><html lang="ru"><meta charset="utf-8"><title>Tank Wars — проверка взрывов</title><style>body{background:#151219;color:#eee;font:16px monospace;margin:20px}canvas{width:640px;height:480px;image-rendering:pixelated;display:block}button{padding:10px;margin:5px}#grid{display:flex;flex-wrap:wrap;gap:16px}figure{margin:0}figcaption{padding:8px}</style><h1>Взрывы Tank Wars: оригинальные пиксели и палитра</h1><div id="grid"></div><button id="death">Смерть танка: пульсация и взрыв</button><button id="shot">Взрыв снаряда со звуком</button><p id="status">Фазы взрыва 20 Kiloton Nuke</p><script type="module">
import {Renderer} from '../dist/render.js';import {Game,tankPixel} from '../dist/engine.js';import {deathEffect} from '../dist/death.js';import {PCSpeaker} from '../dist/sound.js';
const assets='../dist/assets/',catalog=await(await fetch(assets+'weapons.json')).json(),fonts={};for(const f of ['tiny','litt','euro'])fonts[f]=await(await fetch(assets+f+'-font.json')).json();const bitmap=new Uint8Array(await(await fetch(assets+'font8.bin')).arrayBuffer());const speaker=new PCSpeaker(),views=[];
for(const [name,age] of [['Нарастание красного',.12],['Затухание от центра',.40],['Затухание снаружи',.65]]){const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=320;canvas.height=200;caption.textContent=name;figure.append(canvas,caption);document.querySelector('#grid').append(figure);const g=new Game(catalog.weapons,{sound:false,wind:0,background:0,tanksFall:false,crumble:0},42);g.start([{name:'Player 1'},{name:'Player 2'}]);g.falling=null;g.players[0].y=150;g.players[1].y=150;g.phase='flight';g.explode(160,140,30,0);g.explosions[0].age=age;const r=new Renderer(canvas,fonts,bitmap);r.render({screen:'battle',game:g},0);views.push({g,r});}
let active=false,last=0;function frame(t){if(active){const {g,r}=views[0];g.update(Math.min(.05,(t-last)/1000||.016));for(const e of g.events.splice(0))if(e.type==='speaker')speaker.play(e.sequence);r.render({screen:'battle',game:g},t/1000);document.querySelector('#status').textContent='Состояние: '+g.phase+' · эффектов: '+g.explosions.length+' · яркость: '+(g.deathVisual?.level??'—');if(g.phase==='score')active=false;}last=t;requestAnimationFrame(frame);}requestAnimationFrame(frame);
function reset(){const g=views[0].g;g.options.sound=true;g.events=[];g.audioWait=0;g.phase='flight';g.explosions=[];g.deathQueue=[];g.deathAnimation=null;g.deathVisual=null;g.deathWait=0;g.players.forEach(p=>{p.alive=true;p.men=100});speaker.unlock();speaker.stop();active=true;return g;}
document.querySelector('#death').onclick=()=>{const g=reset(),dead={...g.players[0],owner:1};g.players[0].alive=false;g.players[0].men=0;g.dyingTank=dead;const old=g.rng.int.bind(g.rng);let first=true;g.rng.int=n=>{if(first&&n===2){first=false;return 0;}return old(n)};g.deathAnimation=deathEffect(g,dead,tankPixel,6);};
document.querySelector('#shot').onclick=()=>reset().explode(160,140,30,0);
</script></html>
