<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Powerful projectile verification</title>
  <style>
    body {
      background: #15121a;
      color: #eee;
      font: 16px system-ui;
      margin: 20px;
    }
    #views {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      max-width: 1100px;
    }
    figure {
      margin: 0;
    }
    canvas {
      width: 100%;
      image-rendering: pixelated;
    }
    figcaption {
      line-height: 1.5;
    }
    button {
      padding: 12px;
      margin: 12px 0;
    }
    @media (max-width: 700px) {
      #views {
        grid-template-columns: 1fr;
      }
      canvas {
        max-width: 420px;
      }
    }
  </style>
  <h1>Powerful shells: original subdivision cycle</h1>
  <p>
    Production engine. One integration per animation frame exposes the original collision cadence.
  </p>
  <div id="views"></div>
  <button id="play">Run the three shots</button>
  <p id="status">Loading…</p>
  <script type="module">
    import { Game } from '../dist/engine.js';
    import { Renderer } from '../dist/render.js';
    import { loadGameAssets } from '../dist/assets-loader.js';
    const { catalog, fonts, bitmap, title } = await loadGameAssets();
    const views = [];
    function scene(count, power) {
      const g = new Game(
        catalog.weapons,
        { sound: false, wind: 0, walls: 0, background: 0, crumble: 0 },
        42,
      );
      g.start(Array.from({ length: count }, (_, i) => ({ name: `Tank ${i + 1}` })));
      g.falling = null;
      g.phase = 'flight';
      g.wind = 0;
      g.wall = 0;
      g.terrain.data.fill(0);
      for (let x = 11; x <= 309; x++) for (let y = 171; y <= 189; y++) g.terrain.set(x, y, 1);
      for (let x = 100; x <= 140; x++) for (let y = 65; y <= 125; y++) g.terrain.set(x, y, 1);
      g.players.forEach((p, i) => {
        p.x = 30 + 25 * i;
        p.y = 170;
      });
      g.players[0].power = power;
      g.order = Array.from({ length: count }, (_, i) => i);
      g.active = 0;
      g.shots = [
        {
          x: 100,
          y: 90,
          vx: power / 50,
          vy: 0,
          age: 0,
          owner: 0,
          weapon: 1,
          power,
          threshold: 943,
          trail: [],
          guidance: 0,
        },
      ];
      return g;
    }
    for (const [count, power, expected] of [
      [2, 942, 1],
      [2, 1000, 8],
      [10, 1000, 11],
    ]) {
      const figure = document.createElement('figure'),
        canvas = document.createElement('canvas'),
        caption = document.createElement('figcaption');
      canvas.width = 320;
      canvas.height = 200;
      figure.append(canvas, caption);
      document.querySelector('#views').append(figure);
      const g = scene(count, power);
      views.push({
        count,
        power,
        expected,
        g,
        steps: 0,
        renderer: new Renderer(canvas, fonts, bitmap, title),
        caption,
      });
    }
    function draw() {
      for (const v of views) {
        v.renderer.render({ screen: 'battle', options: v.g.options, game: v.g }, 0);
        v.caption.textContent = `${v.count} players · Power ${v.power} · Impact step ${v.steps || '—'} · Original: ${v.expected}`;
      }
    }
    draw();
    document.querySelector('#status').textContent = 'Ready. The threshold is 943 at MEN100.';
    document.querySelector('#play').onclick = () => {
      for (const v of views) {
        v.g = scene(v.count, v.power);
        v.steps = 0;
      }
      document.querySelector('#status').textContent = 'Running…';
      let previous;
      function frame(time) {
        let active = false;
        for (const v of views) {
          if (v.g.shots.length) {
            v.g.updateProjectiles(1 / 600);
            v.steps++;
            active = true;
          } else if (v.g.explosions.length) {
            v.g.updateExplosions(previous ? Math.min(0.05, (time - previous) / 1000) : 0);
            active = true;
          }
        }
        previous = time;
        draw();
        if (active) requestAnimationFrame(frame);
        else
          document.querySelector('#status').textContent =
            (views.every((v) => v.steps === v.expected) ? 'PASS' : 'FAIL') +
            ': impact steps ' +
            views.map((v) => v.steps).join(', ') +
            ' match the original. No shots or explosions remain.';
      }
      requestAnimationFrame(frame);
    };
  </script>
</html>
